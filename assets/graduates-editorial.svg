<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Graduates editorial illustration</title>
  <desc id="desc">A stylized editorial illustration in blue and gold tones, with abstract routes and figures.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3f8fd"/>
      <stop offset="45%" stop-color="#dfeaf7"/>
      <stop offset="100%" stop-color="#cfe1f4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3d6fa7"/>
      <stop offset="100%" stop-color="#173b61"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f7d88d"/>
      <stop offset="100%" stop-color="#e8b557"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#1d4267" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="970" cy="140" r="220" fill="#e8f4ff" opacity="0.8"/>
  <circle cx="1030" cy="180" r="120" fill="#f4fbff" opacity="0.8"/>

  <g opacity="0.28" stroke="#9bb8d7" stroke-width="2" fill="none">
    <path d="M100 650 C 260 500, 420 450, 620 540 S 960 620, 1100 420"/>
    <path d="M120 170 C 290 260, 460 210, 640 300 S 920 350, 1090 220"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="130" y="130" width="940" height="490" rx="38" fill="white"/>
    <rect x="150" y="150" width="900" height="450" rx="28" fill="url(#panel)"/>
  </g>

  <g opacity="0.24" stroke="#dfeaf7" stroke-width="2" fill="none">
    <path d="M180 260 L 820 260"/>
    <path d="M180 350 L 820 350"/>
    <path d="M180 440 L 820 440"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 510 C 300 430, 340 380, 410 360 S 535 305, 630 360 S 780 450, 835 412" stroke="#98bde1" stroke-width="8" stroke-dasharray="10 18" opacity="0.9"/>
    <path d="M245 510 C 320 445, 405 430, 470 405 S 620 390, 710 425 S 830 470, 910 365" stroke="url(#gold)" stroke-width="7" opacity="0.95"/>
  </g>

  <g>
    <circle cx="302" cy="470" r="18" fill="#f0c777"/>
    <circle cx="744" cy="444" r="18" fill="#f0c777"/>
    <circle cx="904" cy="354" r="18" fill="#f0c777"/>
    <circle cx="635" cy="360" r="16" fill="#9dc1ea"/>
    <circle cx="470" cy="405" r="16" fill="#9dc1ea"/>
  </g>

  <g>
    <rect x="640" y="183" width="168" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)"/>
    <circle cx="673" cy="204" r="8" fill="#f0c777"/>
    <text x="690" y="212" fill="#edf7ff" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700">就业地图</text>
  </g>

  <g>
    <path d="M295 510 L 315 490 L 335 510 L 315 530 Z" fill="#9bc1ea"/>
    <path d="M255 548 C 275 470, 330 440, 365 468 L 380 530 C 352 548, 322 558, 255 548 Z" fill="#e7f3ff" opacity="0.95"/>
    <path d="M250 570 C 295 560, 345 570, 373 594 L 362 620 L 278 620 L 244 590 Z" fill="#dff1ff"/>
  </g>

  <g transform="translate(730 285)">
    <path d="M0 145 L 36 48 L 72 145 Z" fill="#8cc8f0"/>
    <path d="M36 48 L 72 145 L 110 48 Z" fill="#d9ecff"/>
    <path d="M42 120 L 60 155 L 102 154 L 76 180 L 84 220 L 56 192 L 28 220 L 34 182 L 8 154 L 44 154 Z" fill="#f7d88d" opacity="0.9"/>
  </g>

  <g>
    <circle cx="918" cy="535" r="70" fill="#e6f1ff" opacity="0.9"/>
    <circle cx="918" cy="535" r="52" fill="#dfeefa"/>
    <text x="918" y="545" text-anchor="middle" fill="#173b61" font-size="28" font-weight="800" font-family="Microsoft YaHei, sans-serif">+12%</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif" fill="#eaf5ff">
    <text x="228" y="218" font-size="18" font-weight="700">家庭所在地</text>
    <text x="410" y="252" font-size="18" font-weight="700">求学区域</text>
    <text x="680" y="215" font-size="18" font-weight="700">就业地</text>
  </g>
</svg>

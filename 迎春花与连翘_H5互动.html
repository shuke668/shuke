<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8f5e9">
<meta name="description" content="根据《藏在中药里的二十四节气》书页线索，互动辨认迎春花与连翘。">
<title>两枝迎春｜草木观察互动</title>
<style>
:root{--paper:#f8f5e9;--paper2:#fffdf5;--ink:#365c50;--green:#6a9b7e;--mint:#a9c99e;--gold:#e6b55f;--coral:#dc9386;--line:#d9dfc9;--muted:#8d9b7e;--shadow:0 12px 34px #647b571b;--font:"FZKai-Z03","FZKai-Z03S","方正楷体_GBK",serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eee1;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}body{min-height:100svh;display:flex;justify-content:center;align-items:flex-start}.app{position:relative;width:100%;max-width:480px;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 0% 0%,#f5e7c8 0,transparent 38%),radial-gradient(ellipse at 100% 30%,#dcebdd 0,transparent 34%),linear-gradient(165deg,var(--paper2),var(--paper));padding:calc(24px + env(safe-area-inset-top)) 22px calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.grain{position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#9f997c 0.55px,transparent .65px);background-size:17px 17px;mask-image:linear-gradient(90deg,#000,transparent 70%)}
header,.main,.footer{position:relative;z-index:1}.brand{display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#819881}.brandmark{display:flex;gap:8px;align-items:center}.brandmark svg{width:22px;height:22px}.edition{border:1px solid #cfdbc5;border-radius:99px;padding:6px 10px;letter-spacing:1px}.hero{text-align:center;padding:34px 0 18px}.eyebrow{font-size:12px;letter-spacing:4px;color:#b18a57;margin-bottom:11px}.hero h1{margin:0;color:#57866f;font-size:clamp(36px,10vw,48px);font-weight:600;letter-spacing:5px;line-height:1.15}.hero p{margin:12px auto 0;font-size:15px;color:#81917d;line-height:1.8;max-width:290px}.botanical{height:166px;position:relative;margin:0 auto 10px;max-width:360px}.botanical svg{width:100%;height:100%;overflow:visible}.float{animation:float 4s ease-in-out infinite;transform-origin:center}.float.delay{animation-delay:-1.5s}.bob{animation:bob 3.2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px) rotate(1deg)}}@keyframes bob{50%{transform:translateY(4px)}}
.main{flex:1;display:flex;flex-direction:column}.panel{background:#fffdf8d9;border:1px solid #e7e4d4;border-radius:25px;box-shadow:var(--shadow);padding:22px 19px 20px;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:#e8f0df77;right:-64px;top:-72px}.progressrow{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.steptext{font-size:12px;letter-spacing:2px;color:#94a08a}.score{font-size:12px;color:#b18a57}.progress{height:5px;background:#edf0e4;border-radius:9px;overflow:hidden;margin:-7px 0 23px;position:relative}.progress span{display:block;height:100%;width:25%;background:linear-gradient(90deg,#e7bb70,#84b59a);border-radius:9px;transition:width .35s ease}.question-label{font-size:12px;color:#bd9460;letter-spacing:2px;margin:0 0 8px;position:relative}.question{font-size:22px;line-height:1.55;margin:0 0 16px;position:relative;color:#426b58;font-weight:600}.clue{position:relative;min-height:92px;display:flex;align-items:center;gap:14px;border-radius:18px;background:linear-gradient(110deg,#f6efd9,#f0f6eb);padding:14px 15px;margin-bottom:17px}.clue-icon{width:54px;height:54px;flex:none;border-radius:17px;background:#fffaf0;display:grid;place-items:center;border:1px solid #efe2c2}.clue-icon svg{width:40px;height:40px}.clue p{font-size:15px;line-height:1.65;margin:0;color:#586f5c}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;position:relative}.option{border:1.5px solid #c8d9bf;background:#fffdf8;border-radius:16px;padding:13px 8px;color:#557c65;font:600 16px var(--font);letter-spacing:1px;cursor:pointer;transition:transform .16s,background .2s,border-color .2s;box-shadow:0 3px 0 #dae4d1}.option:active{transform:translateY(2px);box-shadow:0 1px 0 #dae4d1}.option[disabled]{cursor:default}.option.chosen{background:#eaf3e6;border-color:#6d9d7c;color:#3f775a}.option.missed{background:#fbede6;border-color:#e2a394;color:#a46d61}.feedback{position:relative;margin-top:15px;padding:14px 15px;border-radius:16px;background:#f5f1e4;color:#5a715e;font-size:14px;line-height:1.75;animation:appear .25s ease}.feedback strong{color:#568469}.feedback .mini{display:block;color:#89947e;font-size:12px;margin-top:7px}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.next{margin:17px 0 0;width:100%;border:0;border-radius:99px;padding:14px;background:#6f9f81;color:white;font:600 16px var(--font);letter-spacing:2px;box-shadow:0 5px 0 #507c63;cursor:pointer}.next:active{transform:translateY(2px);box-shadow:0 3px 0 #507c63}.next[hidden],.feedback[hidden]{display:none}.footnote{text-align:center;color:#a0a18d;font-size:11px;line-height:1.7;margin:18px 8px 0}.footer{text-align:center;padding-top:17px;color:#a5a28c;font-size:11px;letter-spacing:1px}.footer b{color:#809b80;font-weight:500}.screen{animation:appear .32s ease}.result{text-align:center;padding-top:22px}.result .stamp{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;background:#eff5e8;border:1px solid #c7d9bd;display:grid;place-items:center}.result h2{font-size:28px;color:#57866f;margin:6px 0 12px;letter-spacing:2px}.result p{font-size:16px;line-height:1.9;color:#667c67;margin:0 auto 14px;max-width:310px}.result .summary{border-top:1px dashed #d9dfc9;padding-top:13px;margin-top:15px;font-size:14px}.restart{background:#e4b865;color:#fffdf6;box-shadow:0 5px 0 #c3964f;margin-top:18px}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-height:800px){.hero{padding-top:46px}.botanical{height:185px;margin-bottom:14px}.panel{padding:24px 21px}}
</style>
</head>
<body>
<div class="app">
  <div class="grain" aria-hidden="true"></div>
  <header>
    <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18C7 12 11 8 20 5M8 15c-1-4-3-6-6-6m8 2c3-4 6-5 10-4m-8 10c1-3 4-5 8-5" fill="none" stroke="#83aa89" stroke-width="1.7" stroke-linecap="round"/><circle cx="4" cy="9" r="1.4" fill="#e5b65f"/></svg><span>草木观察小笺</span></div><span class="edition">立春·春日篇</span></div>
  </header>
  <section class="hero" id="hero">
    <div class="eyebrow">一本书 · 两枝花 · 四条线索</div>
    <h1>两枝迎春</h1>
    <p>你能分清迎春花和连翘吗？<br>跟着书页里的线索，开始观察吧。</p>
    <div class="botanical" aria-hidden="true">
      <svg viewBox="0 0 360 166">
        <path d="M30 139C95 119 135 91 175 46M181 54C225 69 269 92 322 128" fill="none" stroke="#8a7658" stroke-width="5" stroke-linecap="round"/>
        <path d="M106 104C95 81 76 74 60 80c8 18 25 27 46 24m30-21c-2-20 5-34 20-42 7 18 1 33-20 42m71 2c16-20 34-26 53-18-10 18-28 25-53 18m35 19c5-21 18-32 37-34 3 20-9 32-37 34" fill="#a9c99e" stroke="#84a87f" stroke-width="2" stroke-linejoin="round"/>
        <g class="float" transform="translate(145 42)"><path d="M0 2c-15-17-13-32 0-37 11-4 20 4 21 16 8-10 20-10 27-2 9 11 2 26-15 32C21 15 9 12 0 2Z" fill="#f5d374" stroke="#dfa94d" stroke-width="2"/><circle cx="19" cy="-7" r="4" fill="#e9b75f"/></g>
        <g class="float delay" transform="translate(273 104)"><path d="M0 2c-13-15-11-28 0-32 10-4 18 3 19 14 7-8 17-9 23-2 8 10 2 23-13 28C18 13 8 10 0 2Z" fill="#f7d080" stroke="#dfa94d" stroke-width="2"/><circle cx="17" cy="-6" r="3.5" fill="#fff3c6"/></g>
        <g class="bob" fill="#90b693"><ellipse cx="81" cy="49" rx="3" ry="6"/><ellipse cx="83" cy="62" rx="3" ry="6" transform="rotate(32 83 62)"/><ellipse cx="97" cy="47" rx="3" ry="6" transform="rotate(-28 97 47)"/></g>
        <circle cx="43" cy="125" r="3" fill="#e6b55f"/><circle cx="309" cy="46" r="3" fill="#e6b55f"/><path d="M51 34q6-8 12 0m234 78q6-8 12 0" fill="none" stroke="#b4c7a4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </section>
  <main class="main">
    <section id="quiz" class="panel screen" aria-live="polite">
      <div class="progressrow"><span class="steptext" id="steptext">观察卡 01 / 04</span><span class="score" id="score">已答对 0 题</span></div>
      <div class="progress"><span id="progressbar"></span></div>
      <p class="question-label">看线索，选名字</p>
      <h2 class="question" id="question">花瓣有几片？</h2>
      <div class="clue"><div class="clue-icon" id="clueicon" aria-hidden="true"></div><p id="cluetext">哪一种花一般有5—6个裂片？</p></div>
      <div class="options" id="options">
        <button class="option" data-answer="迎春花">迎春花</button><button class="option" data-answer="连翘">连翘</button>
      </div>
      <div class="feedback" id="feedback" hidden></div>
      <button class="next" id="next" hidden>下一条线索</button>
      <p class="footnote">依据《藏在中药里的二十四节气》书页内容</p>
    </section>
    <section id="result" class="panel result screen hidden" aria-live="polite">
      <div class="stamp" aria-hidden="true"><svg viewBox="0 0 64 64" width="45" height="45"><path d="M10 48C22 33 31 22 52 13M23 34c-7-9-13-10-18-6 4 8 10 10 18 6m12-10c1-9 6-14 13-15 2 8-2 14-13 15m-7 31c6-8 13-10 20-6-4 8-11 10-20 6" fill="none" stroke="#6f9f81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="13" r="4" fill="#e8bb68"/></svg></div>
      <div class="eyebrow">观察完成</div>
      <h2>花开有别，线索有迹</h2>
      <p>看花之外，也可以观察茎、枝条和果实。<br>书中用这些细节，带我们认识迎春花与连翘的不同。</p>
      <div class="summary" id="finalscore"></div>
      <button class="next restart" id="restart">再观察一次</button>
      <p class="footnote">内容依据你提供的书页整理</p>
    </section>
  </main>
  <footer class="footer">春日草木观察 · <b>翻开书，慢慢看</b></footer>
</div>
<script>
const questions=[
 {label:'花瓣有几片？',prompt:'哪一种花一般有5—6个裂片？',answer:'迎春花',facts:'迎春花一般有5—6个裂片；连翘花一般有4个裂片。',type:'petals'},
 {label:'茎是什么样？',prompt:'哪一种的茎是棕色或黄褐色，棱不明显，而且中空？',answer:'连翘',facts:'迎春花的茎一般为绿色，上面有明显的棱；连翘的茎为棕色或黄褐色，棱不明显，而且是中空的。',type:'stem'},
 {label:'枝条朝哪里生长？',prompt:'哪一种的枝条一般下垂？',answer:'迎春花',facts:'迎春花的枝条一般下垂；连翘的枝条挺立。',type:'branch'},
 {label:'会不会结果？',prompt:'哪一种会结心形的果实？',answer:'连翘',facts:'书中写到，迎春花一般不结果；连翘会结心形的果实，入药的是连翘的果实。',type:'fruit'}
];
let index=0,correct=0,locked=false;
const q=document.getElementById('question'),promptText=document.getElementById('cluetext'),step=document.getElementById('steptext'),score=document.getElementById('score'),bar=document.getElementById('progressbar'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),icon=document.getElementById('clueicon'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),finalscore=document.getElementById('finalscore');
function flower(count,color){let petals='';for(let i=0;i<count;i++){let a=(360/count)*i;petals+=`<ellipse cx="24" cy="11" rx="6.2" ry="11" fill="${color}" stroke="#d99b67" stroke-width=".8" transform="rotate(${a} 24 24)"/>`}return `<svg viewBox="0 0 48 48" aria-hidden="true">${petals}<circle cx="24" cy="24" r="5" fill="#e6b55f"/><path d="M24 31v12m0-5c-5-4-9-4-12-1 4 5 8 6 12 1m0-4c4-4 8-5 11-2-3 5-7 6-11 2" fill="none" stroke="#7fa27d" stroke-width="2" stroke-linecap="round"/></svg>`}
function stemIcon(){return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M23 42C25 30 22 18 28 6" fill="none" stroke="#a78c65" stroke-width="5" stroke-linecap="round"/><path d="M24 35l-5-5m8-7 6-5" stroke="#6f9979" stroke-width="2"/><path d="M10 15h28M10 20h28" stroke="#c6d7bc" stroke-width="2" stroke-linecap="round"/></svg>`}
function branchIcon(){return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M22 8c2 10 2 17 0 25-1 5-4 8-8 10M22 27c7-7 12-9 18-8" fill="none" stroke="#9a805d" stroke-width="3" stroke-linecap="round"/><path d="M13 42c-6 0-8-4-7-8 5 0 8 3 7 8m26-23c2-5 6-6 9-4-1 4-4 6-9 4" fill="#a9c99e" stroke="#82a47e" stroke-width="1.5"/></svg>`}
function fruitIcon(){return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 10c-7 0-13 6-13 15 0 10 6 17 13 17s13-7 13-17c0-9-6-15-13-15Z" fill="#e8c276" stroke="#b99a5a" stroke-width="2"/><path d="M24 12c-2-5-1-8 3-10m-3 3c-4-4-8-4-10-1 3 4 6 5 10 3" fill="#91b184" stroke="#779b79" stroke-width="1.5" stroke-linecap="round"/><path d="M24 19v18" stroke="#fff2cf" stroke-width="2" opacity=".9"/></svg>`}
function render(){locked=false;let item=questions[index];step.textContent=`观察卡 0${index+1} / 04`;score.textContent=`已答对 ${correct} 题`;bar.style.width=`${(index+1)*25}%`;q.textContent=item.label;promptText.textContent=item.prompt;feedback.hidden=true;feedback.innerHTML='';next.hidden=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=false;b.className='option'});icon.innerHTML=item.type==='petals'?flower(5,'#f3c96c'):item.type==='stem'?stemIcon():item.type==='branch'?branchIcon():fruitIcon();next.textContent=index===questions.length-1?'看观察结果':'下一条线索'}
document.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>{if(locked)return;locked=true;const selected=button.dataset.answer,item=questions[index],isCorrect=selected===item.answer;if(isCorrect)correct++;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.answer===item.answer)b.classList.add('chosen');else if(b===button&&!isCorrect)b.classList.add('missed')});score.textContent=`已答对 ${correct} 题`;feedback.innerHTML=`<strong>${isCorrect?'观察正确':'再看看书页线索'}</strong><br>${item.facts}<span class="mini">本题答案：${item.answer}</span>`;feedback.hidden=false;next.hidden=false}));
next.addEventListener('click',()=>{if(index<questions.length-1){index++;render()}else{quiz.classList.add('hidden');result.classList.remove('hidden');finalscore.textContent=`本次观察：答对 ${correct} / 4 题。无论得分多少，都可以再回到书页，看看这些线索。`}});
document.getElementById('restart').addEventListener('click',()=>{index=0;correct=0;result.classList.add('hidden');quiz.classList.remove('hidden');render()});
render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f8f5e9"><meta name="description" content="从书页中的春日草木选择一个名字，生成专属阅读签。"><title>我的春日阅读签</title>
<style>
:root{--paper:#f8f5e9;--ink:#426b58;--sage:#7c9c7c;--gold:#dfb668;--font:"FZKai-Z03","FZKai-Z03S","方正楷体_GBK",serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eee1;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}.app{min-height:100svh;max-width:520px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 0 0,#f3e6cb 0,transparent 36%),radial-gradient(ellipse at 100% 28%,#e0efdf 0,transparent 37%),linear-gradient(160deg,#fffdf6,#f3f5e9);position:relative;overflow:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#9d9476 .55px,transparent .7px);background-size:18px 18px}.content{position:relative;z-index:1}.brand{font-size:12px;letter-spacing:2px;color:#84957e;display:flex;justify-content:space-between;align-items:center}.pill{border:1px solid #d1ddc9;border-radius:20px;padding:6px 10px}.intro{text-align:center;padding:24px 0 14px}.intro .eyebrow{font-size:11px;letter-spacing:4px;color:#b18b59}.intro h1{font-size:32px;letter-spacing:4px;color:#5b8c72;margin:8px 0 7px}.intro p{font-size:14px;color:#85917d;line-height:1.7;margin:0}.selector-title{display:flex;align-items:center;gap:9px;color:#789178;font-size:13px;letter-spacing:1px;margin:9px 2px 10px}.selector-title:after{content:"";height:1px;background:#dce3d3;flex:1}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.choice{border:1px solid #d8dfcf;background:#fffdf6c9;color:#70836d;border-radius:14px;padding:10px 4px;font:14px var(--font);cursor:pointer;transition:.18s}.choice.active{background:#e9f1e4;border-color:#7da488;color:#47795e;box-shadow:0 3px 0 #d8e3d0;transform:translateY(-1px)}.preview-wrap{display:flex;justify-content:center;padding:2px 0 13px}.card{width:min(100%,338px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 15px 38px #536a4c2b;border:1px solid #e2dbc4;background:#f7f2e4}.card img{width:100%;height:100%;display:block;object-fit:cover}.actions{display:flex;gap:10px}.action{flex:1;border:0;border-radius:99px;background:#6f9d7d;color:#fffdf5;padding:14px 10px;font:600 15px var(--font);letter-spacing:1px;box-shadow:0 4px 0 #517c63;cursor:pointer}.action.alt{background:#e1b565;box-shadow:0 4px 0 #bc9657}.action:active{transform:translateY(2px);box-shadow:0 2px 0 #517c63}.hint{text-align:center;font-size:11px;line-height:1.7;color:#9a9c86;margin:12px 6px 0}.toast{position:fixed;z-index:8;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#446c58;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="app"><div class="grain"></div><main class="content">
<div class="brand"><span>草木观察小笺</span><span class="pill">春日阅读签</span></div>
<section class="intro"><div class="eyebrow">CHOOSE A PLANT · MAKE A BOOKMARK</div><h1>我的春日阅读签</h1><p>选一个书页里的名字<br>生成一张可以收藏的草木小壁纸</p></section>
<div class="selector-title">选择一个草木名字</div>
<div class="choices" id="choices" role="group" aria-label="选择植物名称"></div>
<div class="preview-wrap"><div class="card"><img id="cardImage" alt="春日阅读签预览"></div></div>
<div class="actions"><button class="action" id="savePng">保存为壁纸</button><button class="action alt" id="saveSvg">保存 SVG</button></div>
<p class="hint">阅读签包含所选名称与书名。植物图形为原创形态插画。<br>《藏在中药里的二十四节气》</p>
</main></div><div class="toast" id="toast" role="status"></div>
<script>
const plants=[
 {name:'迎春花',key:'winter-jasmine',a:'#fff7e4',b:'#f2d98f',ink:'#89744f',leaf:'#83a87d',flower:'#f5ca63',style:'arch'},
 {name:'连翘',key:'forsythia',a:'#f4f0d9',b:'#d9e9bd',ink:'#786849',leaf:'#86a975',flower:'#efc354',style:'upright'},
 {name:'青蒿',key:'qinghao',a:'#f2f4df',b:'#dce8bb',ink:'#6f7955',leaf:'#719766',flower:'#d9bd67',style:'feathery'},
 {name:'车前草',key:'plantain',a:'#f3f3dd',b:'#d9e8c4',ink:'#737d5a',leaf:'#789769',flower:'#c6b16f',style:'rosette'},
 {name:'杏',key:'apricot',a:'#fff2df',b:'#f5d2a6',ink:'#946c4f',leaf:'#86a879',flower:'#e99391',style:'fruit'},
 {name:'地皮菜',key:'nostoc',a:'#f0f2df',b:'#cfdfc8',ink:'#65775c',leaf:'#6f9474',flower:'#a7b989',style:'ribbon'},
 {name:'茯苓',key:'poria',a:'#f5eee0',b:'#e5d6bc',ink:'#89765e',leaf:'#9d9b72',flower:'#c9ad7c',style:'tuber'},
 {name:'猪苓',key:'polypore',a:'#f5f0e1',b:'#e3dfc8',ink:'#786b55',leaf:'#879674',flower:'#b99870',style:'cluster'},
 {name:'灵芝',key:'reishi',a:'#f4eddd',b:'#e8ccaa',ink:'#775d48',leaf:'#789179',flower:'#b77b55',style:'fan'}
];
let current=plants[0];const choices=document.getElementById('choices'),img=document.getElementById('cardImage'),toast=document.getElementById('toast');
function plantArt(p){const c=p.flower,l=p.leaf,k=p.ink;switch(p.style){
case'arch':return `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M160 455C260 410 390 345 480 212M268 403C242 345 196 320 144 329M355 350C414 289 472 268 530 280M430 282C430 218 454 171 505 143" stroke="${k}" stroke-width="9"/><path d="M151 331c-37-19-65-15-84 10 28 20 56 20 84-10m78 21c-27-39-55-51-83-35 19 37 47 49 83 35m248-71c28-37 58-47 91-30-17 34-48 47-91 30m-22-99c-5-41 9-70 43-89 18 37 4 68-43 89" fill="${l}" stroke="${l}" stroke-width="3"/><g fill="${c}" stroke="#d89d58" stroke-width="2"><path d="M143 317c-25-27-24-53-2-64 18-9 34 4 36 23 13-17 34-18 46-4 16 20 3 46-27 57-20 7-38 3-53-12Z"/><path d="M493 135c-23-24-22-48-2-58 16-8 30 4 32 21 11-15 29-15 39-3 14 17 3 41-23 51-18 6-34 3-46-11Z"/></g></g>`;
case'upright':return `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M320 465C302 374 310 280 322 175M313 330C248 276 218 214 228 148M319 283C385 230 420 166 412 100M310 385C378 352 434 320 486 267" stroke="${k}" stroke-width="10"/><g fill="${c}" stroke="#d89d58" stroke-width="2">${[[228,148],[412,100],[486,267],[320,175],[216,210],[420,168]].map(([x,y],i)=>`<g transform="translate(${x} ${y}) scale(${i%2?.72:1})"><path d="M0 3c-20-16-18-33-3-40 13-6 24 4 24 18 10-12 24-11 31-1 10 15-1 31-22 36C16 20 7 14 0 3Z"/></g>`).join('')}</g><path d="M316 414c-43-17-74-9-93 23 35 18 66 11 93-23m8-60c41-31 77-36 105-13-26 33-61 39-105 13" fill="${l}" stroke="${l}" stroke-width="3"/></g>`;
case'feathery':return `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M315 467C305 365 311 258 327 130M311 365C260 330 206 304 148 289M315 324C365 284 420 253 477 230M320 268C275 225 232 188 187 147M324 212C369 177 410 142 446 101" stroke="${k}" stroke-width="8"/><g stroke="${l}" stroke-width="10">${[-1,1].map((s,j)=>Array.from({length:7},(_,i)=>{let y=425-i*39,x=313+s*(24+i*8);return `<path d="M${x} ${y}q${s*40} -28 ${s*68} -18"/>`}).join('')).join('')}</g><g fill="${l}"><path d="M313 140q-28-43-4-69 28 30 4 69m12 9q26-47 57-35-13 39-57 35"/></g><g fill="${c}"><circle cx="325" cy="118" r="7"/><circle cx="439" cy="93" r="6"/><circle cx="177" cy="280" r="6"/></g></g>`;
case'rosette':return `<g fill="none" stroke-linejoin="round"><path d="M318 456C315 370 316 271 318 148" stroke="${k}" stroke-width="7"/><path d="M318 420C267 458 184 445 130 384 180 346 256 353 318 420ZM318 414C370 457 450 441 510 380 458 345 380 351 318 414ZM318 393C262 408 209 375 180 315 233 293 286 324 318 393ZM318 392C374 408 428 374 456 315 404 293 349 324 318 392Z" fill="${l}" stroke="#6e916f" stroke-width="4"/><path d="M300 152q18-45 37 0m-37 13q18-44 37 0m-37 13q18-43 37 0" stroke="${c}" stroke-width="8" stroke-linecap="round"/></g>`;
case'fruit':return `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M318 455C286 362 273 263 300 149M291 284C230 244 189 203 174 154M292 246C356 211 404 167 427 112" stroke="${k}" stroke-width="9"/><g fill="#f4c4ae" stroke="#dc9788" stroke-width="3"><path d="M170 157c-24-27-21-50-2-60 16-8 30 3 32 21 11-14 27-14 38-2 13 17 2 38-23 48-17 6-33 3-45-7Z"/><path d="M422 116c-21-24-18-44-1-53 14-7 26 3 28 19 10-13 24-12 34-2 12 15 2 34-21 43-15 5-29 3-40-7Z"/></g><g><path d="M256 344c-28-40-15-84 24-94 29-25 74-10 80 28 24 31 4 76-36 83-29 19-58 10-68-17Z" fill="${c}" stroke="#d18e54" stroke-width="4"/><path d="M324 276c20-33 42-39 66-31-7 27-29 39-66 31Z" fill="${l}" stroke="#789771" stroke-width="3"/><path d="M318 303c-3 20 0 41 9 59" stroke="#f8e6b6" stroke-width="4"/></g></g>`;
case'ribbon':return `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M103 407c20-77 70-128 133-103-35 32-62 70-73 112 38-90 95-130 152-97-56 43-82 93-89 139 46-84 103-112 152-72-61 35-99 73-126 121 66-63 130-69 172-18-72 17-126 44-174 83-48-48-101-70-173-70 28-48 59-71 102-73-4-9-4-17-1-22Z" fill="${l}" stroke="#688a6d" stroke-width="5"/><path d="M170 424q116-48 246-74m-161 87q66-74 144-104" stroke="#c2d1a8" stroke-width="4"/><g fill="${c}"><circle cx="180" cy="399" r="11"/><circle cx="224" cy="364" r="8"/><circle cx="280" cy="426" r="10"/></g></g>`;
case'tuber':return `<g><path d="M176 371c-27-39-3-86 43-91 8-44 69-59 100-26 48-5 75 36 54 74 28 36 3 77-40 79-22 39-75 43-103 14-40 15-70-11-54-50Z" fill="#b89b74" stroke="#8b765c" stroke-width="5"/><path d="M200 355c32 7 58-25 74-59m17 118c-3-34 10-62 44-86m-127 76c21-6 38-16 54-33" fill="none" stroke="#d4bd96" stroke-width="6" stroke-linecap="round"/><path d="M211 365c17-4 28-16 35-31" fill="none" stroke="#806c56" stroke-width="3" opacity=".55"/></g>`;
case'cluster':return `<g fill="${c}" stroke="#8a7357" stroke-width="4"><path d="M197 399c-27-27-12-74 24-79 3-39 48-54 75-29 34-20 69 5 59 42 34 20 25 64-11 75-13 37-61 47-84 19-32 22-68 8-63-28Z"/><path d="M335 376c-20-24-9-59 20-63 2-31 39-43 60-22 27-16 55 4 47 34 27 16 20 50-9 59-10 29-48 37-66 15-25 17-53 6-52-23Z" fill="#ccb28d"/><path d="M144 373c-18-20-8-50 17-53 2-26 34-36 51-18 23-13 46 4 40 29 23 14 17 42-8 50-9 25-41 31-56 12-21 15-45 5-44-20Z" fill="#d5c19c"/></g><g fill="none" stroke="#e7d4ae" stroke-width="3"><path d="M230 350q26 19 13 48m92-52q20 14 10 39m-177-18q16 12 7 31"/></g></g>`;
case'fan':return `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M317 456c2-79-5-124 14-160" stroke="#80664c" stroke-width="14"/><path d="M328 310c-25-48-21-100 11-154 28-47 67-69 119-59 55 10 79 53 69 102-7 35-29 61-67 76-52 20-93 23-132 35Z" fill="${c}" stroke="#9d6948" stroke-width="5"/><path d="M331 310c38-61 90-120 151-178m-133 174c56-42 109-73 159-89m-153 84c46-15 94-21 133-18" stroke="#d7a879" stroke-width="5"/><path d="M340 295c-19-16-39-20-58-12 8 19 27 25 58 12" fill="${l}" stroke="#718b72" stroke-width="3"/></g>`;
}}
function makeSvg(p){return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 540 960"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${p.a}"/><stop offset="1" stop-color="${p.b}"/></linearGradient><radialGradient id="wash"><stop stop-color="#fffdf6" stop-opacity=".82"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/></radialGradient><pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r=".7" fill="${p.ink}" opacity=".15"/><circle cx="15" cy="16" r=".55" fill="${p.leaf}" opacity=".16"/></pattern></defs><rect width="540" height="960" fill="url(#bg)"/><rect width="540" height="960" fill="url(#grain)"/><ellipse cx="271" cy="466" rx="240" ry="250" fill="url(#wash)"/><rect x="22" y="22" width="496" height="916" rx="24" fill="none" stroke="#fffaf0" stroke-width="4"/><rect x="34" y="34" width="472" height="892" rx="18" fill="none" stroke="${p.ink}" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 8"/><g fill="${p.ink}" opacity=".52"><circle cx="62" cy="66" r="4"/><circle cx="478" cy="66" r="4"/><circle cx="62" cy="894" r="4"/><circle cx="478" cy="894" r="4"/></g><text x="270" y="102" text-anchor="middle" font-family="FZKai-Z03, FZKai-Z03S, serif" font-size="16" letter-spacing="7" fill="${p.ink}" opacity=".78">春 日 阅 读 签</text><path d="M194 126h152" stroke="${p.ink}" stroke-opacity=".35"/><g transform="translate(0 20)">${plantArt(p)}</g><text x="270" y="626" text-anchor="middle" font-family="FZKai-Z03, FZKai-Z03S, serif" font-size="51" letter-spacing="9" fill="${p.ink}">${p.name}</text><path d="M210 658q60 18 120 0" fill="none" stroke="${p.flower}" stroke-width="4" stroke-linecap="round"/><text x="270" y="722" text-anchor="middle" font-family="FZKai-Z03, FZKai-Z03S, serif" font-size="17" letter-spacing="3" fill="${p.ink}" opacity=".78">藏在中药里的二十四节气</text><text x="270" y="754" text-anchor="middle" font-family="FZKai-Z03, FZKai-Z03S, serif" font-size="12" letter-spacing="4" fill="${p.ink}" opacity=".62">山 东 友 谊 出 版 社</text><g transform="translate(250 813)" fill="none" stroke="${p.leaf}" stroke-width="2" stroke-linecap="round"><path d="M20 36C20 20 20 10 20 0m0 25C9 15 2 15-5 19m25-7c8-8 15-9 22-5"/><path d="M-5 19c-3-8-9-10-15-7 3 7 8 10 15 7m27-7c4-8 10-10 16-7-3 7-8 10-16 7" fill="${p.leaf}" opacity=".7" stroke="none"/></g><text x="270" y="893" text-anchor="middle" font-family="FZKai-Z03, FZKai-Z03S, serif" font-size="12" letter-spacing="5" fill="${p.ink}" opacity=".65">草 木 有 名 · 春 日 可 读</text><g fill="${p.flower}" opacity=".72"><circle cx="97" cy="465" r="4"/><circle cx="444" cy="403" r="3"/><circle cx="102" cy="545" r="2.5"/><circle cx="433" cy="543" r="4"/></g></svg>`}
function render(){const buttons=[...choices.querySelectorAll('button')];buttons.forEach(b=>b.classList.toggle('active',b.dataset.key===current.key));const svg=makeSvg(current);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);img.alt=`${current.name}春日阅读签；书名《藏在中药里的二十四节气》`;}
plants.forEach((p,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=p.name;b.dataset.key=p.key;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{current=p;[...choices.children].forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});render()});choices.appendChild(b)});
function say(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900)}
document.getElementById('saveSvg').addEventListener('click',()=>{const blob=new Blob([makeSvg(current)],{type:'image/svg+xml;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`春日阅读签_${current.name}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say('SVG 已保存')});
document.getElementById('savePng').addEventListener('click',()=>{const svg=makeSvg(current),blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,1080,1920);URL.revokeObjectURL(url);canvas.toBlob(png=>{const a=document.createElement('a');a.href=URL.createObjectURL(png);a.download=`春日阅读签_${current.name}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200);say('壁纸已保存')},'image/png')};image.onerror=()=>{URL.revokeObjectURL(url);say('请使用“保存 SVG”下载阅读签')};image.src=url});
render();
</script></body></html>

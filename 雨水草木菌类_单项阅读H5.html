<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8f5e9">
<meta name="description" content="点开《藏在中药里的二十四节气》雨水页面中的草木与菌类名称。">
<title>雨水后的名字｜草木观察互动</title>
<style>
:root{--paper:#f8f5e9;--paper2:#fffdf5;--ink:#365c50;--green:#6a9b7e;--mint:#a9c99e;--gold:#e6b55f;--orange:#e7a05c;--line:#d9dfc9;--muted:#8d9b7e;--shadow:0 12px 34px #647b571b;--font:"FZKai-Z03","FZKai-Z03S","方正楷体_GBK",serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eee1;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}body{min-height:100svh;display:flex;justify-content:center;align-items:flex-start}.app{position:relative;width:100%;max-width:480px;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 0% 0%,#f5e7c8 0,transparent 38%),radial-gradient(ellipse at 100% 27%,#dcebdd 0,transparent 36%),linear-gradient(165deg,var(--paper2),var(--paper));padding:calc(24px + env(safe-area-inset-top)) 22px calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.grain{position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#9f997c .55px,transparent .65px);background-size:17px 17px;mask-image:linear-gradient(90deg,#000,transparent 72%)}header,.main,.footer{position:relative;z-index:1}.brand{display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#819881}.brandmark{display:flex;gap:8px;align-items:center}.brandmark svg{width:22px;height:22px}.edition{border:1px solid #cfdbc5;border-radius:99px;padding:6px 10px;letter-spacing:1px}.hero{text-align:center;padding:32px 0 17px}.eyebrow{font-size:12px;letter-spacing:4px;color:#bd9160;margin-bottom:10px}.hero h1{margin:0;color:#57866f;font-size:clamp(34px,9vw,45px);font-weight:600;letter-spacing:4px;line-height:1.2}.hero p{margin:12px auto 0;font-size:15px;color:#81917d;line-height:1.85;max-width:320px}.hero-art{height:130px;max-width:330px;margin:4px auto 0}.hero-art svg{width:100%;height:100%;overflow:visible}.rain{animation:fall 2.8s ease-in-out infinite}.rain:nth-child(2){animation-delay:-.9s}.rain:nth-child(3){animation-delay:-1.6s}@keyframes fall{0%,100%{transform:translateY(-4px);opacity:.65}50%{transform:translateY(5px);opacity:1}}.panel{background:#fffdf8e8;border:1px solid #e7e4d4;border-radius:25px;box-shadow:var(--shadow);padding:21px 19px 19px;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:#e8f0df77;right:-67px;top:-75px}.panel>*{position:relative}.section-label{font-size:12px;letter-spacing:2px;color:#bd9160;margin:0 0 7px}.prompt{font-size:19px;line-height:1.65;color:#426b58;margin:0 0 15px;font-weight:600}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{appearance:none;border:1.5px solid #cfdbc5;background:#fbfcf4;border-radius:15px;min-height:48px;padding:11px 8px;color:#5f896f;font:600 16px var(--font);letter-spacing:1px;cursor:pointer;box-shadow:0 3px 0 #e3e8d9;transition:all .18s}.choice:active{transform:translateY(2px);box-shadow:0 1px 0 #e3e8d9}.choice.active{background:#e9f2e5;border-color:#72a184;color:#3e765a;box-shadow:0 3px 0 #c6dbc7}.detail{margin-top:17px;min-height:126px;border-radius:18px;background:linear-gradient(115deg,#f8f1df,#eff5e9);padding:15px 15px 14px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;animation:show .25s ease}.detail[hidden]{display:none}.detail-art{width:76px;height:76px;border-radius:22px;background:#fffdf7;border:1px solid #e8e3cf;display:grid;place-items:center;overflow:hidden}.detail-art svg{width:66px;height:66px}.detail h2{font-size:19px;color:#608b6d;margin:0 0 7px;letter-spacing:1px}.detail p{font-size:14px;line-height:1.8;color:#5d705e;margin:0}.hint{font-size:12px;line-height:1.6;color:#96a08d;text-align:center;margin:13px 4px 0}.complete{margin:17px 0 0;width:100%;border:0;border-radius:99px;padding:13px;background:#6f9f81;color:white;font:600 15px var(--font);letter-spacing:2px;box-shadow:0 5px 0 #507c63;cursor:pointer;animation:show .25s ease}.complete:active{transform:translateY(2px);box-shadow:0 3px 0 #507c63}.complete[hidden]{display:none}.notice{padding:23px 16px 24px;text-align:center;border-radius:19px;background:#f0f5e9;border:1px dashed #afc7a9;animation:show .28s ease}.notice[hidden]{display:none}.notice .seal{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fffaf0;border:1px solid #e9d7ae;margin:0 auto 13px;color:#c59553;font-size:22px}.notice p{font-size:16px;line-height:1.9;color:#527760;margin:0}.notice small{display:block;color:#919b87;margin-top:10px;font-size:12px}@keyframes show{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.restart{background:#e4b865;box-shadow:0 5px 0 #c3964f;margin-top:16px}.footer{text-align:center;padding-top:17px;color:#a5a28c;font-size:11px;letter-spacing:1px}.footer b{color:#809b80;font-weight:500}.hide{display:none!important}
@media(min-height:790px){.hero{padding-top:38px}.hero-art{height:147px;margin-top:8px}.panel{padding:23px 20px 20px}}
</style>
</head>
<body>
<div class="app">
<div class="grain" aria-hidden="true"></div>
<header><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18C7 12 11 8 20 5M8 15c-1-4-3-6-6-6m8 2c3-4 6-5 10-4m-8 10c1-3 4-5 8-5" fill="none" stroke="#83aa89" stroke-width="1.7" stroke-linecap="round"/><circle cx="4" cy="9" r="1.4" fill="#e5b65f"/></svg><span>草木观察小笺</span></div><span class="edition">雨水·书页互动</span></div></header>
<section class="hero">
<div class="eyebrow">翻开书页 · 点开一个名字</div>
<h1>雨水后的草木信</h1>
<p>地皮菜、茯苓、猪苓、灵芝<br>点选一个名字，只读这一页的线索。</p>
<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 330 130">
<path d="M26 88c47-8 78-9 119 2s83 13 155-5" fill="none" stroke="#b6cbb0" stroke-width="3" stroke-linecap="round"/>
<path d="M60 92c7-26 21-39 42-43 2 21-10 36-42 43Zm86 7c8-27 25-40 47-41 0 22-15 37-47 41Zm87-7c13-21 30-29 49-25-5 20-21 29-49 25Z" fill="#a9c99e" stroke="#84a87f" stroke-width="2" stroke-linejoin="round"/>
<g class="rain" fill="#82b8b0"><path d="M44 34c0-9 12-22 12-22s12 13 12 22a12 12 0 1 1-24 0Z"/><path d="M155 25c0-7 9-17 9-17s9 10 9 17a9 9 0 1 1-18 0Z"/><path d="M259 39c0-8 11-20 11-20s11 12 11 20a11 11 0 1 1-22 0Z"/></g>
<g fill="#e6b55f"><circle cx="117" cy="65" r="3"/><circle cx="221" cy="74" r="2.5"/></g><path d="M20 109q8-8 16 0m258-21q7-7 14 0" fill="none" stroke="#d49d68" stroke-width="2" stroke-linecap="round"/>
</svg></div>
</section>
<main class="panel">
<div id="selection">
<p class="section-label">选择一项</p>
<h2 class="prompt">你想点开书页里的哪个名字？</h2>
<div class="choices" role="group" aria-label="选择植物或菌类名称">
<button class="choice" data-name="地皮菜">地皮菜</button><button class="choice" data-name="茯苓">茯苓</button><button class="choice" data-name="猪苓">猪苓</button><button class="choice" data-name="灵芝">灵芝</button>
</div>
<div class="detail" id="detail" hidden aria-live="polite">
<div class="detail-art" id="detailArt" aria-hidden="true"></div>
<div><h2 id="detailTitle"></h2><p id="detailText"></p></div>
</div>
<p class="hint" id="hint">点击名称后，内容区只展示你选中的一项。</p>
<button class="complete" id="complete" hidden>读完这一页</button>
</div>
<div class="notice" id="notice" hidden aria-live="polite">
<div class="seal" aria-hidden="true">阅</div>
<p>以上内容来自《藏在中药里的二十四节气》对应书页。<br>请继续翻阅原书，了解完整内容。</p>
<small>雨水 · 第14—15页</small>
<button class="complete restart" id="again">再点开一个名字</button>
</div>
</main>
<footer class="footer">雨水草木图鉴 · <b>一页一读，慢慢观察</b></footer>
</div>
<script>
const entries={
 '地皮菜':{text:'雨后，在不受污染的河堤、山地、草原上，都可以发现地皮菜的身影。地皮菜是真菌与藻类的共生联合体。地皮菜不仅美味，还富含蛋白质、维生素和钙。同时，它味甘性凉，能入肝经，具有清肝明目、收敛益气的功效。',art:'地皮菜'},
 '茯苓':{text:'多寄生于马尾松或赤松的根部，药性平和，利湿而不伤正气，可治小便不利、水肿胀满。',art:'茯苓'},
 '猪苓':{text:'多生长在海拔1000～2000米向阳山地的阔叶林下，药性微热，有解热除湿、行窍利水的功效。',art:'猪苓'},
 '灵芝':{text:'属高温性菌类，在15～35℃均能生长。灵芝在我国已有2000多年的药用历史，被历代医药家视为滋补强壮、扶正固本的珍品。',art:'灵芝'}
};
function illustration(name){
 if(name==='灵芝')return `<svg viewBox="0 0 80 80"><path d="M36 67c4-13 3-22 1-30" fill="none" stroke="#77513c" stroke-width="8" stroke-linecap="round"/><path d="M39 39C17 39 9 27 14 17c4-9 18-11 26 0 2-12 14-18 25-11 14 8 10 25-7 31-7 3-13 3-19 2Z" fill="#9f4f37" stroke="#88452f" stroke-width="3"/><path d="M21 22q11-8 21 0m1 5q11-10 22-3m-37 9q13-7 25 0" fill="none" stroke="#d38a5f" stroke-width="2.4" stroke-linecap="round"/><path d="M45 44c13-4 22 2 20 10-2 7-12 9-20 2" fill="#a85c40" stroke="#88452f" stroke-width="2"/></svg>`;
 if(name==='茯苓')return `<svg viewBox="0 0 80 80"><path d="M13 51 28 28l25-9 17 14-4 26-23 9-23-6Z" fill="#c4a88b" stroke="#967c64" stroke-width="2.5" stroke-linejoin="round"/><path d="m28 28 5 26 10 14m10-49-5 27 18 13M13 51l20 3 30 5" fill="none" stroke="#e2d3c0" stroke-width="2"/><path d="M24 41q10-9 17-2m8-12q8-3 14 3" fill="none" stroke="#aa9177" stroke-width="2" stroke-linecap="round"/></svg>`;
 if(name==='猪苓')return `<svg viewBox="0 0 80 80"><path d="M14 51c0-8 9-14 19-13 3-11 18-14 26-6 11 0 17 8 14 17-2 8-10 12-20 10-8 9-24 7-29 0-6 1-10-2-10-8Z" fill="#987759" stroke="#7e644b" stroke-width="2.5"/><path d="M21 49q7-8 15-5m1 14q8-10 17-8m-4-19q8-4 14 1" fill="none" stroke="#c7aa86" stroke-width="2.5" stroke-linecap="round"/><path d="M31 40c3-8 10-11 16-9" fill="none" stroke="#80654c" stroke-width="2"/></svg>`;
 return `<svg viewBox="0 0 80 80"><path d="M12 46c0-8 9-14 17-14 4-12 17-14 24-5 9-1 16 5 15 12 7 6 3 17-7 18-6 8-18 7-22 1-9 6-24 2-24-7-3-1-4-3-3-5Z" fill="#52734f" stroke="#3f6145" stroke-width="2.5"/><path d="M21 43q10-9 19-5m-12 16q9-8 18-3m1-20q8-6 15-1m-11 23q8-7 15-4" fill="none" stroke="#91aa75" stroke-width="3" stroke-linecap="round"/><path d="M29 37q-3 9 2 17m18-21q-5 10 1 19" fill="none" stroke="#344f40" stroke-width="2"/></svg>`;
}
const buttons=[...document.querySelectorAll('.choice')],detail=document.getElementById('detail'),title=document.getElementById('detailTitle'),text=document.getElementById('detailText'),art=document.getElementById('detailArt'),complete=document.getElementById('complete'),hint=document.getElementById('hint'),selection=document.getElementById('selection'),notice=document.getElementById('notice');
buttons.forEach(button=>button.addEventListener('click',()=>{const name=button.dataset.name;buttons.forEach(b=>b.classList.toggle('active',b===button));const item=entries[name];title.textContent=name;text.textContent=item.text;art.innerHTML=illustration(item.art);detail.hidden=false;complete.hidden=false;hint.textContent='当前只显示“'+name+'”的书页内容；点击其他名称可切换。'}));
complete.addEventListener('click',()=>{selection.classList.add('hide');notice.hidden=false;window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('again').addEventListener('click',()=>{notice.hidden=true;selection.classList.remove('hide');detail.hidden=true;complete.hidden=true;hint.textContent='点击名称后，内容区只展示你选中的一项。';buttons.forEach(b=>b.classList.remove('active'));window.scrollTo({top:0,behavior:'smooth'})});
</script>
</body>
</html>
